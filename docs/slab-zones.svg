<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="420" rx="20" fill="#0f172a"/>

  <!-- The face you aim at: a centre square and four edge zones -->
  <g stroke="#94a3b8" stroke-width="2" stroke-linejoin="round">
    <polygon points="60,60 360,60 285,135 135,135" fill="#1e293b"/>
    <polygon points="60,360 360,360 285,285 135,285" fill="#1e293b"/>
    <polygon points="60,60 135,135 135,285 60,360" fill="#1e293b"/>
    <polygon points="360,60 360,360 285,285 285,135" fill="#22c55e" fill-opacity="0.55"/>
    <rect x="135" y="135" width="150" height="150" fill="#334155"/>
  </g>
  <g font-size="18" fill="#e2e8f0" text-anchor="middle">
    <text x="210" y="105">Top</text>
    <text x="210" y="332">Bottom</text>
    <text x="97" y="216">Left</text>
    <text x="322" y="216">Right</text>
    <text x="210" y="216">Centre</text>
  </g>
  <!-- Crosshair, aiming at the right edge -->
  <g stroke="#f8fafc" stroke-width="2">
    <line x1="322" y1="160" x2="322" y2="182"/>
    <line x1="311" y1="171" x2="333" y2="171"/>
  </g>
  <text x="210" y="398" font-size="15" fill="#64748b" text-anchor="middle">Edge bands are 25% of the face</text>

  <text x="430" y="92" font-size="28" font-weight="700" fill="#f8fafc">Where you aim decides the slab</text>
  <g font-size="19">
    <text x="430" y="150" font-weight="600" fill="#5eead4">Centre</text>
    <text x="430" y="175" fill="#94a3b8">Flat against the face, like vanilla</text>
    <text x="430" y="210" font-weight="600" fill="#5eead4">Top or bottom edge of a wall</text>
    <text x="430" y="235" fill="#94a3b8">Upper or lower half slab</text>
    <text x="430" y="270" font-weight="600" fill="#5eead4">Left or right edge, or a floor/ceiling edge</text>
    <text x="430" y="295" fill="#94a3b8">Vertical slab against that edge</text>
    <text x="430" y="330" font-weight="600" fill="#5eead4">Empty half of a slab</text>
    <text x="430" y="355" fill="#94a3b8">Completes it into a full block</text>
  </g>
  <text x="430" y="398" font-size="15" fill="#64748b">A translucent box previews the result before you click.</text>
</svg>
